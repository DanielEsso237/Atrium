[pytest]
testpaths = tests
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
# `auto` evite d'avoir a decorer chaque test async avec @pytest.mark.asyncio :
# tout `async def test_*` est pris en charge tel quel.
filterwarnings =
    error::DeprecationWarning:app.*
addopts = -q --strict-markers
markers =
    db: test qui a besoin d'une vraie base PostgreSQL (voir tests/conftest.py)
