[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# L'URL reelle est injectee par alembic/env.py depuis app.core.config,
# pour qu'il n'y ait qu'une seule source de verite (le fichier .env).
sqlalchemy.url =

# Formatage automatique des migrations generees.
# `ruff` doit etre celui du venv : l'executable global n'existe pas ici.
[post_write_hooks]
hooks = ruff
ruff.type = exec
ruff.executable = %(here)s/.venv/Scripts/ruff.exe
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
